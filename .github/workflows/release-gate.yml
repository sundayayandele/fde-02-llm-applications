name: release-gate

# Runs fde-03's evaluation against this commit: FinanceBench test half, refusal set, red team,
# judge calibration and the release gate (thresholds, regression vs the v1.1.0 baseline,
# red-team critical categories). The job fails when the gate fails. Offline: no API key.
on:
  pull_request:
    paths: ["src/**", "app/**", "config/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: ${{ !endsWith(github.repository, '-starter') }}
    uses: sundayayandele/fde-03-evaluation/.github/workflows/gate.yml@main
    with:
      fde02_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      fde02_repository: ${{ github.repository }}
