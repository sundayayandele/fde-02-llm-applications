# Docker Desktop's built-in Kubernetes shares Docker's image store, so the image
# built with `docker build -t fde-02-llm-applications:local .` is used directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: fde-02-llm-applications
    newName: fde-02-llm-applications
    newTag: local
components:
  - ../_shared
