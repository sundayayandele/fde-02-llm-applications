# Ingress only on the HTTP port. Egress is left open because the service calls
# hosted LLM APIs; fde-05 tightens this for the air-gapped design.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fde-02-llm-applications
spec:
  podSelector:
    matchLabels:
      app: fde-02-llm-applications
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8000}
