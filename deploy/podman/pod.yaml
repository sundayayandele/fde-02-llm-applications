# Podman Desktop: run with `podman kube play --replace deploy/podman/pod.yaml`
# after `podman build -t localhost/fde-02-llm-applications:local .` (or `make up-podman`).
# The same manifest style is used later on Kubernetes, which makes this a gentle
# first step from containers to pods. Mistral key (optional), as a Kubernetes-style secret:
#   kubectl create secret generic fde-02-llm-applications-mistral \
#     --from-literal=MISTRAL_API_KEY="$MISTRAL_API_KEY" --dry-run=client -o yaml \
#     | podman kube play -
apiVersion: v1
kind: Pod
metadata:
  name: fde-02-llm-applications
  labels:
    app.kubernetes.io/name: fde-02-llm-applications
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: localhost/fde-02-llm-applications:local
      ports:
        - containerPort: 8000
          hostPort: 8000
          hostIP: 127.0.0.1
      env:
        - name: ENVIRONMENT
          value: local
        - name: LLM_PROVIDER
          value: mistral
        - name: MISTRAL_API_KEY            # optional: without it, answers are extractive
          valueFrom:
            secretKeyRef: {name: fde-02-llm-applications-mistral, key: MISTRAL_API_KEY,
                           optional: true}
      resources:
        limits:
          cpu: "1"
          memory: 1536Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      livenessProbe:
        httpGet: {path: /health/live, port: 8000}
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        httpGet: {path: /health/ready, port: 8000}
        initialDelaySeconds: 3
        periodSeconds: 5
  volumes:
    - name: tmp
      emptyDir: {}
