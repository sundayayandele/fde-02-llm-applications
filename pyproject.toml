[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-02-llm-applications"
version = "1.1.0"
description = "Document assistant over company filings: hybrid retrieval, reranking, cited answers, refusals, MCP tools, streaming API and UI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sunday Ayandele" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "prometheus-client>=0.21",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.10",
  "pillow>=10.4",
  "mcp>=2.0,<3",
]

[project.scripts]
filing-assistant = "filing_assistant.cli:main"
filing-assistant-mcp = "filing_assistant.mcp_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "exercise: learner exercise tests; expected to fail in the starter repo until the TODO is done",
]

[tool.coverage.run]
source = ["src", "app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S603", "S607"]
